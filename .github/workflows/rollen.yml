name: rollen

# Rollen-Rundgang mit Fotos als Beleg. Eigener Workflow: scripts/deploy-hetzner.sh
# wartet nur auf „tests“, eine wacklige Geschichte blockiert also keinen Deploy.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rundgang:
    # Playwright unterstützt ubuntu-latest (26.04) noch nicht.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Rollen-Rundgang
        run: npm run test:rollen

      - name: Beweisbericht hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beweisbericht
          path: test-results-rollen/rollen/bericht
          if-no-files-found: warn
          retention-days: 30
